# Codemagic: builds Marmo Focus on a cloud Mac and uploads it to App Store Connect.
# Free personal plan: 500 macOS M2 minutes per month. Start builds by hand from codemagic.io.
#
# Needs, set once in Codemagic (never commit these):
#   - App Store Connect API key integration named "marmo_asc"
#     (Personal settings → Integrations → Developer Portal → Manage keys)
#   - Environment variable group "marmo_signing" with CERTIFICATE_PRIVATE_KEY (secret):
#     an RSA private key used for the distribution certificate. Keep the same key forever.
#
# Before each new upload, raise the build number (Xcode "Build" / CURRENT_PROJECT_VERSION).

workflows:
  ios-release:
    name: iOS release (App Store Connect)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: marmo_asc
    environment:
      groups:
        - marmo_signing
      node: 20
      xcode: latest
      vars:
        XCODE_PROJECT: marmo-focus-src/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install packages and build the web app
        working_directory: marmo-focus-src
        script: |
          npm ci
          npm run ios:sync
      - name: Set up code signing (App, MarmoMonitor, MarmoShield)
        script: |
          set -e
          # Clean up the private key pasted into Codemagic: drop Windows line endings and
          # convert it to unencrypted PEM. The key itself is never printed.
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "Key header: $(head -1 "$KEY_FILE")"
          # Accepts PEM with no passphrase, PEM whose passphrase is literally "" (PowerShell quirk),
          # and OpenSSH-format keys.
          if openssl rsa -in "$KEY_FILE" -passin pass: -traditional -out "$KEY_FILE.pem" 2>/dev/null \
             || openssl rsa -in "$KEY_FILE" -passin 'pass:""' -traditional -out "$KEY_FILE.pem" 2>/dev/null; then
            mv "$KEY_FILE.pem" "$KEY_FILE"
          elif ! ssh-keygen -p -m PEM -P "" -N "" -f "$KEY_FILE" >/dev/null 2>&1 \
             && ! ssh-keygen -p -m PEM -P '""' -N "" -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "CERTIFICATE_PRIVATE_KEY is not a usable RSA private key (wrong text or protected by a passphrase)."
            exit 1
          fi
          openssl rsa -in "$KEY_FILE" -check -noout
          echo "Key header after cleanup: $(head -1 "$KEY_FILE")"

          keychain initialize
          for id in com.ardavelioglu.marmofocus com.ardavelioglu.marmofocus.monitor com.ardavelioglu.marmofocus.shield; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE --create --certificate-key "@file:$KEY_FILE"
          done
          rm -f "$KEY_FILE"
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the .ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
